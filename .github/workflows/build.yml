name: Build and Release

on:
  push:
    branches: ['1.21.1-NeoForge']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read mod version
        id: metadata
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          [[ "$version" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "Invalid mod_version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Collect installable JARs
        shell: bash
        run: |
          mkdir -p release-jars
          shopt -s nullglob
          for jar in build/libs/kaleidoscope_compat-*.jar; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-dev.jar) continue ;;
            esac
            cp "$jar" release-jars/
          done
          jars=(release-jars/*.jar)
          (( ${#jars[@]} > 0 )) || { echo "No installable mod JAR found"; exit 1; }

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: kaleidoscope-compat-mc1.21.1-${{ github.sha }}
          path: release-jars/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/1.21.1-NeoForge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: kaleidoscope-compat-mc1.21.1-${{ github.sha }}
          path: release-jars

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MOD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${MOD_VERSION}-build.${GITHUB_RUN_NUMBER}"
          title="Kaleidoscope Compat ${MOD_VERSION} (build ${GITHUB_RUN_NUMBER})"
          cat > release-notes.md <<EOF
          Minecraft 1.21.1 / NeoForge / Kaleidoscope Cookery 1.6.0

          Download the JAR below and disable the previous kaleidoscope_compat JAR before installing.
          This is an automatically compiled fork build; compilation does not replace in-game compatibility testing.

          Commit: ${GITHUB_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          # A rerun uploads to the same release instead of creating duplicate versions.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-jars/*.jar --clobber
          else
            gh release create "$tag" release-jars/*.jar \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          fi
